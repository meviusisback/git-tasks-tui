[package]
name = "gtasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0.0"
libc = "0.2"
portable-pty = "0.9"
pulldown-cmark = "0.13.5"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros", "sync", "time", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vt100 = "0.15"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
all = "deny"
