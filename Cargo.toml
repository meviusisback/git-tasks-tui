[package]
name = "gtasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0.0"
libc = "0.2"
portable-pty = "0.9"
pulldown-cmark = "0.13.5"
ratatui = "0.29"
unicode-width = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros", "sync", "time", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Vendored: upstream vt100 0.18.1 with the unicode-width requirement relaxed
# to "0.2" (only stable width traits are used). The registry 0.18 needs
# ^0.2.2 while ratatui pins =0.2.0 and cargo will not split the pair, so a
# registry dependency cannot resolve. See vendor/vt100/Cargo.toml.
vt100 = { path = "vendor/vt100", version = "0.18" }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
all = "deny"
