name: ci

on:
  push:
  pull_request:

# Least privilege for all jobs (F-4).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned SHAs (F-4); update both together with the version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked
      - name: no-duplicate-crossterm
        # One crossterm in the whole tree (F-3). NOTE: `cargo tree -d` nests
        # its lines, so the check uses `--prefix none` to get countable
        # top-level `name vX.Y` rows.
        run: test "$(cargo tree --locked --prefix none | awk '/^crossterm v/{print $2}' | sort -u | wc -l)" = "1"
      - name: audit-controls
        # Threat controls: git/fs behaviour, no binary needed (16/16).
        run: bash tests/invariants/run_all.sh --suite controls
      - name: audit-invariants
        # S7/S14 assertions against the freshly built binary.
        run: bash tests/invariants/run_all.sh --suite invariants --bin target/debug/gtasks

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
          targets: x86_64-apple-darwin
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: check-intel
        # Apple Silicon runners cross-check the Intel slice (check only).
        run: cargo check --locked --target x86_64-apple-darwin
      - name: test
        run: cargo test --locked
